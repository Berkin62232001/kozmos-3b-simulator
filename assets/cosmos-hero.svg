<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Kozmos 3B Ultra — WebGL2 and GLSL Astrophysics Universe Simulator Preview">
  <defs>
    <radialGradient id="bgGrad" cx="52%" cy="48%" r="72%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#070d1f"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="milkyWay" x1="0%" y1="80%" x2="100%" y2="15%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0"/>
      <stop offset="30%" stop-color="#312e81" stop-opacity="0.22"/>
      <stop offset="52%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#7c3aed" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bhGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="34%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fff7ed" stop-opacity="0.95"/>
      <stop offset="52%" stop-color="#f97316" stop-opacity="0.72"/>
      <stop offset="72%" stop-color="#9a3412" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diskDoppler" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#fff7ed" stop-opacity="1"/>
      <stop offset="58%" stop-color="#fb923c" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#dc2626" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="jetTop" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jetBot" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="timelineBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="55%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <radialGradient id="earthGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <radialGradient id="saturnGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowTight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="520" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Deep Space & Milky Way Band -->
    <rect width="1200" height="520" fill="url(#bgGrad)"/>
    <ellipse cx="620" cy="245" rx="680" ry="115" transform="rotate(-18 620 245)" fill="url(#milkyWay)"/>

    <!-- Spectral Starfield -->
    <g fill="#f8fafc">
      <circle cx="85" cy="72" r="1.4" opacity="0.85"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="145" cy="148" r="1.1" fill="#93c5fd" opacity="0.7"/>
      <circle cx="210" cy="96" r="1.8" fill="#fef08a" opacity="0.9"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="182" r="1.0" opacity="0.65"/>
      <circle cx="342" cy="84" r="1.5" fill="#bae6fd" opacity="0.8"/>
      <circle cx="428" cy="112" r="1.1" opacity="0.7"/>
      <circle cx="490" cy="68" r="1.6" fill="#fed7aa" opacity="0.85"/>
      <circle cx="715" cy="76" r="1.3" fill="#c4b5fd" opacity="0.8"/>
      <circle cx="792" cy="128" r="1.7" fill="#fef08a" opacity="0.85"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="884" cy="86" r="1.2" opacity="0.75"/>
      <circle cx="962" cy="156" r="1.5" fill="#7dd3fc" opacity="0.85"/>
      <circle cx="1055" cy="92" r="1.8" fill="#e0f2fe" opacity="0.9"><animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="1125" cy="175" r="1.2" opacity="0.7"/>
      <circle cx="110" cy="312" r="1.3" fill="#bae6fd" opacity="0.75"/>
      <circle cx="188" cy="390" r="1.6" fill="#fde68a" opacity="0.8"/>
      <circle cx="264" cy="336" r="1.1" opacity="0.6"/>
      <circle cx="380" cy="378" r="1.4" fill="#c4b5fd" opacity="0.75"/>
      <circle cx="835" cy="355" r="1.5" fill="#93c5fd" opacity="0.8"/>
      <circle cx="945" cy="310" r="1.1" opacity="0.65"/>
      <circle cx="1028" cy="372" r="1.7" fill="#fed7aa" opacity="0.85"><animate attributeName="opacity" values="0.5;0.95;0.5" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="315" r="1.3" opacity="0.75"/>
      <circle cx="1148" cy="435" r="1.1" opacity="0.65"/>
      <circle cx="72" cy="442" r="1.2" opacity="0.7"/>
    </g>

    <!-- Orbital Guides -->
    <ellipse cx="600" cy="246" rx="370" ry="125" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="5 7" transform="rotate(-11 600 246)"/>
    <ellipse cx="600" cy="246" rx="255" ry="86" fill="none" stroke="#f97316" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="4 6" transform="rotate(-11 600 246)"/>

    <!-- Relativistic Polar Plasma Jets -->
    <g transform="rotate(14 600 246)" filter="url(#glowSoft)">
      <polygon points="596,246 604,246 626,38 574,38" fill="url(#jetTop)" opacity="0.78">
        <animate attributeName="opacity" values="0.62;0.92;0.62" dur="3.6s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="596,246 604,246 626,454 574,454" fill="url(#jetBot)" opacity="0.78">
        <animate attributeName="opacity" values="0.62;0.92;0.62" dur="3.6s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Raymarched Black Hole + Gravitational Lensing & Accretion Disk -->
    <g transform="translate(600, 246)">
      <!-- Outer HDR Halo -->
      <circle cx="0" cy="0" r="138" fill="url(#bhGlow)" opacity="0.9"/>

      <!-- Gravitationally Lensed Upper & Lower Light Arcs -->
      <ellipse cx="0" cy="0" rx="82" ry="76" fill="none" stroke="url(#diskDoppler)" stroke-width="7" opacity="0.78" filter="url(#glowTight)"/>
      <ellipse cx="0" cy="0" rx="74" ry="71" fill="none" stroke="#fff7ed" stroke-width="2.2" opacity="0.92"/>

      <!-- Event Horizon Shadow -->
      <circle cx="0" cy="0" r="56" fill="#000000"/>
      <circle cx="0" cy="0" r="57.5" fill="none" stroke="#fdba74" stroke-width="1.4" opacity="0.85" filter="url(#glowTight)"/>

      <!-- Front Equatorial Doppler-Beamed Accretion Disk -->
      <g transform="rotate(-11)">
        <ellipse cx="0" cy="4" rx="195" ry="34" fill="none" stroke="url(#diskDoppler)" stroke-width="16" opacity="0.88" filter="url(#glowSoft)"/>
        <ellipse cx="0" cy="3" rx="168" ry="26" fill="none" stroke="url(#diskDoppler)" stroke-width="7" opacity="0.95"/>
        <ellipse cx="0" cy="2" rx="140" ry="18" fill="none" stroke="#fff7ed" stroke-width="2.2" opacity="0.82" stroke-dasharray="90 22 45 18">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- TDE Spaghettification Tidal Stream -->
      <path d="M -295,-44 Q -170,-12 -90,14 Q -20,34 85,22 Q 175,10 275,-34" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" opacity="0.72" filter="url(#glowTight)">
        <animate attributeName="stroke-dashoffset" from="72" to="0" dur="2.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Procedural Earth Accent (Left Orbit) -->
    <g transform="translate(238, 286)">
      <circle cx="0" cy="0" r="28" fill="#38bdf8" opacity="0.22" filter="url(#glowSoft)"/>
      <circle cx="0" cy="0" r="22" fill="url(#earthGrad)"/>
      <path d="M -10,-8 Q -2,-14 8,-6 Q 12,2 4,8 Q -4,10 -12,2 Z" fill="#22c55e" opacity="0.72"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.8"/>
      <text x="0" y="39" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">PBR EARTH</text>
    </g>

    <!-- Procedural Ringed Saturn Accent (Right Orbit) -->
    <g transform="translate(955, 208)">
      <ellipse cx="0" cy="0" rx="52" ry="13" transform="rotate(-18)" fill="none" stroke="#fde68a" stroke-width="6" opacity="0.45"/>
      <circle cx="0" cy="0" r="21" fill="url(#saturnGrad)"/>
      <path d="M -50,16 A 52,13 -18 0,0 50,-16" fill="none" stroke="#fcd34d" stroke-width="4.5" opacity="0.82"/>
      <text x="0" y="42" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">J1407b / SATURN</text>
    </g>

    <!-- Glassmorphic Top Telemetry HUD Strip -->
    <g transform="translate(26, 22)">
      <rect width="388" height="44" rx="11" fill="#0f172a" fill-opacity="0.84" stroke="#38bdf8" stroke-opacity="0.32"/>
      <circle cx="20" cy="22" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="19" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12.5" letter-spacing="0.6">KOZMOS 3B ULTRA</text>
      <text x="165" y="19" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, monospace" font-weight="600" font-size="10.5">WebGL2 · HDR</text>
      <text x="34" y="34" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">40 GLSL Shaders  |  45 Bodies  |  24,000+ GPU Particles</text>
    </g>

    <!-- Top-Right Live Stat Pills -->
    <g transform="translate(866, 22)">
      <rect width="308" height="44" rx="11" fill="#0f172a" fill-opacity="0.84" stroke="#94a3b8" stroke-opacity="0.28"/>
      <text x="16" y="18" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">RENDER PIPELINE</text>
      <text x="16" y="33" fill="#e2e8f0" font-family="ui-monospace, monospace" font-weight="700" font-size="11">16-bit HalfFloat</text>
      <line x1="142" y1="10" x2="142" y2="34" stroke="#334155"/>
      <text x="156" y="18" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">SKY BAKE</text>
      <text x="156" y="33" fill="#7dd3fc" font-family="ui-monospace, monospace" font-weight="700" font-size="11">2048px Cube</text>
      <line x1="244" y1="10" x2="244" y2="34" stroke="#334155"/>
      <text x="257" y="18" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">FPS</text>
      <text x="257" y="33" fill="#4ade80" font-family="ui-monospace, monospace" font-weight="700" font-size="11">60</text>
    </g>

    <!-- Bottom-Left Mini 3D Radar Preview -->
    <g transform="translate(26, 396)">
      <rect width="112" height="102" rx="11" fill="#0f172a" fill-opacity="0.86" stroke="#94a3b8" stroke-opacity="0.28"/>
      <text x="12" y="17" fill="#e2e8f0" font-family="ui-monospace, monospace" font-weight="700" font-size="9.5">3D RADAR</text>
      <circle cx="56" cy="58" r="32" fill="#020617" stroke="#38bdf8" stroke-opacity="0.35"/>
      <circle cx="56" cy="58" r="18" fill="none" stroke="#38bdf8" stroke-opacity="0.18"/>
      <line x1="56" y1="58" x2="56" y2="26" stroke="#38bdf8" stroke-width="1.5" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="0 56 58" to="360 56 58" dur="4s" repeatCount="indefinite"/>
      </line>
      <circle cx="56" cy="58" r="2.5" fill="#f8fafc"/>
      <circle cx="71" cy="47" r="2.4" fill="#f97316"/>
      <circle cx="42" cy="66" r="2" fill="#38bdf8"/>
      <circle cx="64" cy="72" r="2" fill="#c084fc"/>
    </g>

    <!-- Bottom Center Smooth Event Lab Timeline Preview -->
    <g transform="translate(220, 412)">
      <rect width="760" height="86" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.3"/>
      <rect x="14" y="12" width="118" height="20" rx="5" fill="#38bdf8"/>
      <text x="73" y="25.5" text-anchor="middle" fill="#020617" font-family="system-ui, sans-serif" font-weight="800" font-size="10">EVENT LAB</text>
      <text x="144" y="25.5" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="11.5">Tidal Disruption Event (TDE) &amp; Galaxy Merger — 6-Stage GPU Physics</text>

      <!-- Fluid Animated Progress Bar -->
      <rect x="16" y="46" width="728" height="6" rx="3" fill="#1e293b"/>
      <rect x="16" y="46" width="0" height="6" rx="3" fill="url(#timelineBar)">
        <animate attributeName="width" values="40;710;40" dur="9s" repeatCount="indefinite"/>
      </rect>
      <circle cx="56" cy="49" r="6.5" fill="#ffffff" stroke="#38bdf8" stroke-width="2.2" filter="url(#glowTight)">
        <animate attributeName="cx" values="56;726;56" dur="9s" repeatCount="indefinite"/>
      </circle>

      <!-- Stage Labels -->
      <text x="16" y="72" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">1. Approach</text>
      <text x="138" y="72" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">2. Roche Limit</text>
      <text x="272" y="72" fill="#38bdf8" font-family="ui-monospace, monospace" font-weight="700" font-size="9.5">3. Spaghettification</text>
      <text x="424" y="72" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">4. Shock Stream</text>
      <text x="548" y="72" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">5. Accretion Disk</text>
      <text x="668" y="72" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="9.5">6. Polar Jet</text>
    </g>

    <!-- Subtle Outer Frame -->
    <rect x="1" y="1" width="1198" height="518" rx="18" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>
</svg>
